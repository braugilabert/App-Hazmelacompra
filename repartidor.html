<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazmelacompra · Repartidor</title>
<style>
  :root { --verde:#1f8a4c; --verde-osc:#166538; --fondo:#f5f7f6; --borde:#dfe5e1; --txt:#1b2a22; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--fondo); color:var(--txt); }
  header { background:var(--verde-osc); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:1.15rem; }
  main { max-width:720px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px; }
  button { cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:.92rem; background:var(--verde); color:#fff; }
  button.sec { background:#e8f3ec; color:var(--verde-osc); }
  button:disabled { background:#a9b8af; cursor:not-allowed; }
  input { padding:9px; border:1px solid var(--borde); border-radius:8px; font:inherit; }
  .filtros { display:flex; gap:6px; flex-wrap:wrap; }
  .filtros button { background:#fff; color:var(--txt); border:1px solid var(--borde); }
  .filtros button.on { background:var(--verde); color:#fff; border-color:var(--verde); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .estado { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.78rem; background:#fff3cd; }
  .estado.recogiendo { background:#d9ebff; } .estado.en_camino { background:#e0d9ff; }
  .estado.entregado { background:#d4f0dc; } .estado.cancelado { background:#f5d6d2; }
  .parada { border-top:1px dashed var(--borde); padding:8px 0; }
  .badge { display:inline-block; background:var(--verde); color:#fff; border-radius:999px; padding:1px 9px; font-size:.78rem; margin-right:6px; }
  .item { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .item.hecho { color:#7b8a81; text-decoration:line-through; }
  .mapa { font-size:.85rem; color:var(--verde-osc); }
  small, .vacio { color:#6b7a72; }
  .acciones { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #login { max-width:340px; margin:60px auto; text-align:center; }
  #login input { text-align:left; }
</style>
</head>
<body>
<header>
  <h1>🛵 Panel de repartidor</h1>
  <button class="sec" id="salir" style="display:none">Salir</button>
</header>

<div id="login" class="card">
  <h2>Acceso</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="username" style="width:100%;margin:6px 0">
  <input id="pin" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;margin:6px 0">
  <button id="entrar" style="width:100%">Entrar</button>
  <p id="err" class="vacio"></p>
</div>

<main id="panel" style="display:none">
  <div class="filtros" id="filtros"></div>
  <div id="pedidos"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const eur = n => n.toFixed(2).replace('.', ',') + ' €';
const ESTADOS = [['activos','Activos'],['pendiente','Pendientes'],['recogiendo','Recogiendo'],['en_camino','En camino'],['entregado','Entregados'],['cancelado','Cancelados']];
let token = ''; try { token = sessionStorage.getItem('token') || ''; } catch (e) {}
let filtro = 'activos';
let timer = null;

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (r.status === 401) { salir(); throw new Error('Sesión caducada'); }
  return r;
}

function salir() {
  try { sessionStorage.removeItem('token'); } catch (e) {} token = ''; clearInterval(timer);
  $('panel').style.display = 'none'; $('salir').style.display = 'none'; $('login').style.display = 'block';
}

async function entrar() {
  if (!token) {
    const l = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('pin').value }) });
    if (!l.ok) { $('err').textContent = 'Email o contraseña incorrectos'; return; }
    const d = await l.json();
    if (d.rol !== 'repartidor') { $('err').textContent = 'Esta cuenta no es de repartidor'; return; }
    token = d.token;
  }
  try {
    const r = await api('/api/pedidos');
    if (!r.ok) throw 0;
    try { sessionStorage.setItem('token', token); } catch (e) {}
    $('login').style.display = 'none'; $('panel').style.display = 'grid'; $('salir').style.display = 'inline-block';
    $('err').textContent = ''; $('pin').value = '';
    pintarFiltros(); pintar(await r.json());
    clearInterval(timer); timer = setInterval(refrescar, 15000);
  } catch (e) { token = ''; $('err').textContent = 'No se pudo entrar'; }
}

function pintarFiltros() {
  $('filtros').innerHTML = ESTADOS.map(([k, n]) =>
    `<button class="${k === filtro ? 'on' : ''}" onclick="setFiltro('${k}')">${n}</button>`).join('');
}
function setFiltro(f) { filtro = f; pintarFiltros(); refrescar(); }

async function refrescar() {
  const url = ['activos', ''].includes(filtro) ? '/api/pedidos' : '/api/pedidos?estado=' + filtro;
  const r = await api(url);
  let data = await r.json();
  if (filtro === 'activos') data = data.filter(p => ['pendiente', 'recogiendo', 'en_camino'].includes(p.estado));
  pintar(data);
}

function pintar(pedidos) {
  if (!pedidos.length) { $('pedidos').innerHTML = '<p class="vacio">No hay pedidos en esta vista.</p>'; return; }
  $('pedidos').innerHTML = pedidos.map(p => {
    const total = p.paradas.reduce((n, x) => n + x.items.length, 0);
    const hechos = p.paradas.reduce((n, x) => n + x.items.filter(i => i.recogido).length, 0);
    const cerrado = ['entregado', 'cancelado'].includes(p.estado);
    return `<div class="card" style="margin-bottom:14px">
      <div class="top">
        <div><b>#${p.id}</b> <span class="estado ${p.estado}">${p.estado.replace('_', ' ')}</span><br>
          <small>${p.cliente} · <a href="tel:${p.telefono}">${p.telefono}</a></small></div>
        <div style="text-align:right"><b>${eur(p.total)}</b><br><small>${hechos}/${total} recogidos</small></div>
      </div>
      <p style="margin:8px 0 0">📍 ${p.direccion_entrega}<br><small>${p.franja}${p.notas ? ' · ' + p.notas : ''}</small></p>
      ${p.paradas.map(par => `
        <div class="parada">
          <span class="badge">${par.parada}</span><b>${par.tienda}</b>
          <small>${par.direccion}</small>
          <a class="mapa" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${par.lat},${par.lon}">Ver mapa</a>
          ${par.items.map(i => `
            <div class="item ${i.recogido ? 'hecho' : ''}">
              <input type="checkbox" ${i.recogido ? 'checked disabled' : ''} ${cerrado ? 'disabled' : ''}
                     onchange="recoger('${p.id}', ${i.id})">
              <span>${i.cantidad} × ${i.nombre}</span>
            </div>`).join('')}
        </div>`).join('')}
      <div class="acciones">
        ${p.estado === 'en_camino' ? `<button onclick="estado('${p.id}','entregado')">✔ Marcar entregado</button>` : ''}
        ${!cerrado ? `<button class="sec" onclick="estado('${p.id}','cancelado')">Cancelar pedido</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function recoger(pid, iid) { await api(`/api/pedidos/${pid}/items/${iid}/recogido`, { method: 'POST' }); refrescar(); }
async function estado(pid, e) {
  if (e === 'cancelado' && !confirm('¿Cancelar este pedido?')) return;
  await api(`/api/pedidos/${pid}/estado`, { method: 'PATCH', body: JSON.stringify({ estado: e }) });
  refrescar();
}

$('entrar').onclick = entrar;
$('pin').addEventListener('keydown', e => e.key === 'Enter' && entrar());
$('salir').onclick = async () => { await api('/api/logout', { method: 'POST' }).catch(() => {}); salir(); };
if (token) entrar();
</script>
</body>
</html>
